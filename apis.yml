aid: getaleph
name: Getaleph
description: >-
  Aleph (Getaleph) is an AI-native financial planning and analysis (FP&A) platform that
  automates finance busywork so teams can focus on strategic work. It consolidates data
  from 150+ ERP, CRM, and HRIS integrations using no-code tools, syncs live data into
  Excel and Google Sheets, and builds interactive dashboards for stakeholders. The Aleph
  Agent delivers instant, auditable answers in Slack, Teams, or Aleph, and the hosted
  Aleph Agent MCP server plugs governed financial data directly into Claude, ChatGPT,
  Cursor, and other MCP-compatible AI tools without CSV exports. Aleph is SOC 1 & 2 Type II
  certified and is backed by Khosla Ventures.
